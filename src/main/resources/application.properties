
spring.application.name=seoapplication

spring.datasource.url=jdbc:mysql://localhost:3306/seoapplication?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
#spring.jpa.show-sql=true

app.jwt.secret=${JWT_SECRET}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS}
app.frontend-url=${FRONTEND_URL}
semrush.api.key=${SEMRUSH_API_KEY}
semrush.api.base-url=${SEMRUSH_BASE_URL}